[package]
name = "crypto-native"
version = "2.0.0"
edition = "2021"
description = "Cross-platform cryptography library (Rust core for KMP)"

[lib]
name = "encrust"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
secp256k1 = { version = "0.29", features = ["global-context", "rand", "recovery"] }
rand = "0.8"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
