language = "C"
include_guard = "ENCRUST_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not modify. */"
tab_width = 4
usize_is_size_t = true

[parse]
parse_deps = false

[fn]
prefix = ""
postfix = ""
args = "horizontal"
rename_args = "none"

[struct]
rename_fields = "none"

[enum]
rename_variants = "none"

[export]
include = []
exclude = []
