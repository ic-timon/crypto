name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-tvos,arm64_32-apple-watchos

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Rust cross-compile targets
        # Android 4 ABIs + Apple 4 targets + tvOS/watchOS (best effort)
        run: |
          set +e  # some targets may not be available on all toolchains
          rustup target add \
            aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-darwin aarch64-apple-darwin
          # tvOS/watchOS targets may not exist; ignore errors (will skip in build)
          rustup target add aarch64-apple-tvos || echo "skip aarch64-apple-tvos"
          rustup target add arm64_32-apple-watchos || echo "skip arm64_32-apple-watchos"
          rustup target add x86_64-apple-tvos || echo "skip x86_64-apple-tvos"
          rustup target add x86_64-apple-watchos || echo "skip x86_64-apple-watchos"
          true

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install NDK
        run: |
          NDK_VERSION=$(sdkmanager --list 2>/dev/null | sed -nE 's/^[[:space:]]*ndk;([0-9.]+).*/\1/p' | head -1)
          [ -z "$NDK_VERSION" ] && NDK_VERSION=$(sdkmanager --list 2>/dev/null | awk '/^[[:space:]]+ndk;/ {sub(/^[[:space:]]+ndk;/,""); print; exit}')
          [ -z "$NDK_VERSION" ] && { echo "::error::No NDK version found via sdkmanager"; exit 1; }
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" | tee -a "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION" || { echo "::error::NDK dir not present at $ANDROID_HOME/ndk/$NDK_VERSION"; exit 1; }

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Rust (Android ABIs)
        run: |
          cd rust
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "=== cargo ndk $abi ==="
            cargo ndk -t $abi -P 33 build --release --features jni-bridge 2>&1 | tail -20
            target=$(case $abi in
              arm64-v8a) echo aarch64-linux-android;;
              armeabi-v7a) echo armv7-linux-androideabi;;
              x86) echo i686-linux-android;;
              x86_64) echo x86_64-linux-android;;
            esac)
            cp -f target/$target/release/libencrust.so ../crypto/src/androidMain/jniLibs/$abi/ 2>/dev/null || true
          done
        env:
          RUSTFLAGS: "-A warnings"
      - name: Test GitHub Packages Maven auth
        run: |
          echo "token length: ${#GITHUB_TOKEN}"
          status=$(curl -s -o /tmp/maven-meta.xml -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://maven.pkg.github.com/ic-timon/crypto/mobi/timon/crypto/crypto-android/maven-metadata.xml")
          echo "maven.pkg.github.com crypto-android/maven-metadata.xml status=$status"
          head -3 /tmp/maven-meta.xml
      - name: Gradle Build Release AAR
        # 显式 assemble release — publish task 依赖 AAR 生成
        run: ./gradlew :crypto:assembleRelease --no-daemon --stacktrace 2>&1 | tail -20
      - name: Gradle Publish (Android AAR)
        run: ./gradlew :crypto:publishReleasePublicationToGitHubPackagesRepository --no-daemon --stacktrace 2>&1 | tail -30
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find AAR (hardcoded path)
        id: aar
        run: |
          set +e
          ls -la crypto/build/outputs/aar/ 2>&1 || echo "no aar dir"
          # 直接定位单个 AAR — 已知文件名
          AAR=$(find . -name 'crypto-release.aar' 2>/dev/null | head -1)
          echo "DEBUG: AAR_PATH=$AAR"
          echo "AAR_PATH=$AAR" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.aar.outputs.aar_path }}
            ${{ steps.aar.outputs.debug_path }}
