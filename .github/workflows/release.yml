name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-tvos,arm64_32-apple-watchos

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install NDK
        run: |
          NDK_VERSION=$(sdkmanager --list 2>/dev/null | sed -nE 's/^[[:space:]]*ndk;([0-9.]+).*/\1/p' | head -1)
          [ -z "$NDK_VERSION" ] && NDK_VERSION=$(sdkmanager --list 2>/dev/null | awk '/^[[:space:]]+ndk;/ {sub(/^[[:space:]]+ndk;/,""); print; exit}')
          [ -z "$NDK_VERSION" ] && { echo "::error::No NDK version found via sdkmanager"; exit 1; }
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          ls "$ANDROID_NDK_HOME" || { echo "::error::NDK_HOME not populated"; exit 1; }

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release
        run: ./gradlew :crypto:assembleRelease --no-daemon --stacktrace --info 2>&1 | tail -100
        env:
          RUSTFLAGS: "-A warnings"
          RUST_BACKTRACE: "1"

      - name: Publish to GitHub Packages (full KMP — Android + Apple)
        # 触发全部 8 个 KMP publications（Android AAR + 7 Apple targets 的 .klib）。
        run: ./gradlew :crypto:publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find AAR
        id: aar
        run: |
          set +e  # 容忍 set -e + find 没匹配
          ls -la crypto/build/outputs/aar/ 2>&1 || true
          AAR=$(find crypto/build/outputs/aar -name 'crypto-release.aar' 2>/dev/null | head -1)
          [ -z "$AAR" ] && AAR=$(find crypto/build/outputs/aar -name '*.aar' 2>/dev/null | head -1)
          echo "AAR_PATH=$AAR" >> "$GITHUB_OUTPUT"
          echo "DEBUG: AAR=$AAR exists=$([ -n "$AAR" ] && [ -f "$AAR" ] && echo yes || echo no)"
          DEBUG=$(find crypto/build/outputs/aar -name 'crypto-debug.aar' 2>/dev/null | head -1)
          [ -n "$DEBUG" ] && echo "DEBUG_PATH=$DEBUG" >> "$GITHUB_OUTPUT"
          true  # ensure exit 0

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.aar.outputs.aar_path }}
            ${{ steps.aar.outputs.debug_path }}
