name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-tvos,arm64_32-apple-watchos

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install NDK
        run: |
          NDK_VERSION=$(sdkmanager --list 2>/dev/null | sed -nE 's/^[[:space:]]*ndk;([0-9.]+).*/\1/p' | head -1)
          [ -z "$NDK_VERSION" ] && NDK_VERSION=$(sdkmanager --list 2>/dev/null | awk '/^[[:space:]]+ndk;/ {sub(/^[[:space:]]+ndk;/,""); print; exit}')
          [ -z "$NDK_VERSION" ] && { echo "::error::No NDK version found via sdkmanager"; exit 1; }
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME_FROM_ENV=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION" || { echo "::error::NDK dir not present"; exit 1; }

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Rust (Android ABIs)
        # cargo-ndk 编 4 个 Android ABI 的 libencrust.so → src/androidMain/jniLibs/
        # ANDROID_NDK_HOME 由 "Install NDK" step 写入 GITHUB_ENV，这里自动可见
        run: |
          cd rust
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "=== cargo ndk $abi ==="
            cargo ndk -t $abi -P 33 build --release --features jni-bridge 2>&1 | tail -25
          done
          # 复制 .so 到 jniLibs（buildRustAndroid Gradle task 会做，但绕开后要手动）
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            target=$(case $abi in
              arm64-v8a) echo aarch64-linux-android;;
              armeabi-v7a) echo armv7-linux-androideabi;;
              x86) echo i686-linux-android;;
              x86_64) echo x86_64-linux-android;;
            esac)
            cp -f target/$target/release/libencrust.so ../crypto/src/androidMain/jniLibs/$abi/
          done
        env:
          RUSTFLAGS: "-A warnings"
      - name: Build Rust (Apple targets)
        run: |
          cd rust
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-darwin aarch64-apple-darwin; do
            echo "=== cargo build $target ==="
            cargo build --release --target $target 2>&1 | tail -15
          done
        env:
          RUSTFLAGS: "-A warnings"
      - name: Gradle Publish (full KMP — Android + Apple)
        # 用预编的 .so/.a，让 Gradle 的 K/N compile + 8 publications 全部成功
        # 跳过 :crypto:assembleRelease（K/N compile 会重新触发 cargo build，这里只走 publish）
        run: ./gradlew :crypto:publish --no-daemon --stacktrace 2>&1 | tail -100
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find AAR
        id: aar
        run: |
          set +e  # 容忍 set -e + find 没匹配
          ls -la crypto/build/outputs/aar/ 2>&1 || true
          AAR=$(find crypto/build/outputs/aar -name 'crypto-release.aar' 2>/dev/null | head -1)
          [ -z "$AAR" ] && AAR=$(find crypto/build/outputs/aar -name '*.aar' 2>/dev/null | head -1)
          echo "AAR_PATH=$AAR" >> "$GITHUB_OUTPUT"
          echo "DEBUG: AAR=$AAR exists=$([ -n "$AAR" ] && [ -f "$AAR" ] && echo yes || echo no)"
          DEBUG=$(find crypto/build/outputs/aar -name 'crypto-debug.aar' 2>/dev/null | head -1)
          [ -n "$DEBUG" ] && echo "DEBUG_PATH=$DEBUG" >> "$GITHUB_OUTPUT"
          true  # ensure exit 0

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.aar.outputs.aar_path }}
            ${{ steps.aar.outputs.debug_path }}
